[package]
name = "persian_markdown_viewer"
version = "0.1.0"
description = "A local RTL Markdown viewer with Persian math digits"
authors = ["Parsify contributors"]
license = "MIT"
repository = "https://github.com/GoyimUser/Parsify"
edition = "2021"

[lib]
name = "persian_markdown_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
